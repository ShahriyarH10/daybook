<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daybook</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Caveat:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/tabler-icons.min.css">
<style>
/* ── reset + tokens ─────────────────────────────────── */
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --cream:#FBF7EF; --cream-d:#EDE8DC; --cream-dd:#E3DBCC;
  --line:#DDD6C5; --ink:#2B2A28; --ink-s:#5A5650; --ink-f:#9A958C;
  --accent:#D2602F; --accent-s:#FBE3D3; --accent-d:#A8481F;
  --sage:#7A8B6F; --sage-s:#E6EBE0; --sage-d:#566048;
  --slate:#5C7A99; --slate-s:#E2EAF1; --slate-d:#3F5A75;
  --plum:#8E6C9C; --plum-s:#EFE5F2; --plum-d:#664D72;
  --gold:#C99A3B; --gold-s:#F8EDD3; --gold-d:#967323;
  --r:12px; --r-s:8px; --sidebar:220px;
}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',sans-serif;background:var(--cream);color:var(--ink);
  -webkit-font-smoothing:antialiased;display:flex;height:100vh;}
h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-.01em;}
::selection{background:var(--accent-s);}
button{cursor:pointer;border:none;background:none;font-family:inherit;}
textarea,input,select{font-family:'Inter',sans-serif;outline:none;}

/* ── sidebar ────────────────────────────────────────── */
.sidebar{
  width:var(--sidebar);flex-shrink:0;background:var(--cream-d);
  border-right:1.5px solid var(--line);display:flex;flex-direction:column;
  padding:20px 0 16px;height:100vh;
}
.brand{display:flex;align-items:center;gap:9px;padding:0 18px 20px;
  font-family:'Fraunces',serif;font-weight:700;font-size:19px;letter-spacing:-.02em;
  border-bottom:1.5px solid var(--line);margin-bottom:14px;}
.brand-mark{width:28px;height:28px;background:var(--accent);border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  color:var(--cream);font-size:14px;transform:rotate(-5deg);}
.nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:0 10px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-s);
  font-size:14px;font-weight:500;color:var(--ink-s);transition:background .12s,color .12s;cursor:pointer;}
.nav-item i{font-size:18px;}
.nav-item:hover{background:var(--cream-dd);color:var(--ink);}
.nav-item.active{background:white;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(43,42,40,.07);}
.nav-item .badge{margin-left:auto;font-size:11px;font-weight:700;background:var(--accent-s);
  color:var(--accent-d);padding:2px 7px;border-radius:99px;}
.sidebar-date{padding:14px 18px 0;font-family:'Caveat',cursive;font-size:16px;
  color:var(--ink-f);border-top:1.5px solid var(--line);}

/* ── main shell ─────────────────────────────────────── */
.shell{flex:1;display:flex;flex-direction:column;overflow:hidden;height:100vh;}

/* ── topbar ─────────────────────────────────────────── */
.topbar{display:flex;align-items:center;gap:12px;padding:14px 24px;
  border-bottom:1.5px solid var(--line);background:var(--cream);flex-shrink:0;}
.topbar h2{font-size:18px;flex:1;}
.topbar-actions{display:flex;gap:8px;align-items:center;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;
  border-radius:var(--r-s);font-size:13.5px;font-weight:600;
  transition:transform .12s,background .12s,box-shadow .12s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--ink);color:var(--cream);}
.btn-primary:hover{background:#3d3b39;}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
.btn-ghost:hover{background:var(--cream-d);}
.search-wrap{position:relative;flex:0 0 200px;}
.search-wrap i{position:absolute;left:10px;top:50%;transform:translateY(-50%);
  color:var(--ink-f);font-size:16px;pointer-events:none;}
.search-wrap input{width:100%;padding:7px 10px 7px 32px;border:1.5px solid var(--line);
  border-radius:var(--r-s);background:white;font-size:13.5px;color:var(--ink);transition:border-color .15s;}
.search-wrap input:focus{border-color:var(--accent);}

/* ── pages ──────────────────────────────────────────── */
.page{flex:1;overflow:hidden;display:none;}
.page.active{display:flex !important;}

/* ══════════════════════════════════════════════════════
   TASKS PAGE
══════════════════════════════════════════════════════ */
#page-tasks{gap:0;}
.tasks-left{width:300px;flex-shrink:0;border-right:1.5px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;background:var(--cream);}
.tasks-right{flex:1;display:flex;flex-direction:column;overflow:hidden;background:white;}

/* stat strip */
.stat-strip{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1.5px solid var(--line);flex-shrink:0;}
.stat-cell{padding:12px 10px;border-right:1.5px solid var(--line);display:flex;flex-direction:column;gap:2px;}
.stat-cell:last-child{border-right:none;}
.stat-cell .num{font-family:'Fraunces',serif;font-size:22px;font-weight:600;line-height:1;}
.stat-cell .lbl{font-size:10.5px;color:var(--ink-f);font-weight:500;text-transform:uppercase;letter-spacing:.04em;}
.stat-cell.danger .num{color:var(--accent-d);}
.stat-cell.success .num{color:var(--sage-d);}

/* filter bar */
.filter-bar{padding:8px 12px;border-bottom:1.5px solid var(--line);
  display:flex;gap:5px;align-items:center;flex-shrink:0;flex-wrap:wrap;}
.filter-pill{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;
  border:1.5px solid var(--line);background:white;color:var(--ink-s);transition:all .12s;cursor:pointer;}
.filter-pill.active{background:var(--ink);color:var(--cream);border-color:var(--ink);}
.filter-pill.cat-academics.active{background:var(--slate-s);color:var(--slate-d);border-color:var(--slate-s);}
.filter-pill.cat-work.active{background:var(--gold-s);color:var(--gold-d);border-color:var(--gold-s);}
.filter-pill.cat-personal.active{background:var(--sage-s);color:var(--sage-d);border-color:var(--sage-s);}
.filter-pill.cat-coding.active{background:var(--plum-s);color:var(--plum-d);border-color:var(--plum-s);}
.filter-bar .sort-label{font-size:11px;color:var(--ink-f);font-weight:500;white-space:nowrap;}

/* today/next-up panel */
.today-panel{padding:14px 16px;border-top:1.5px solid var(--line);flex-shrink:0;background:var(--cream);}
.today-panel .tp-head{font-family:'Caveat',cursive;font-size:16px;font-weight:600;color:var(--ink-s);
  margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.progress-bar{height:5px;background:var(--line);border-radius:99px;margin-bottom:10px;overflow:hidden;}
.progress-bar .fill{height:100%;background:var(--accent);border-radius:99px;transition:width .5s cubic-bezier(.16,1,.3,1);}
.next-up{background:var(--accent-s);border-radius:var(--r-s);padding:9px 12px;
  font-size:13px;font-weight:500;display:flex;align-items:center;gap:9px;color:var(--ink);}
.next-up i{font-size:16px;color:var(--accent-d);flex-shrink:0;}
.next-up span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* task list pane */
.task-list-pane{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px;}
.task-list-pane::-webkit-scrollbar{width:5px;}
.task-list-pane::-webkit-scrollbar-track{background:transparent;}
.task-list-pane::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px;}

/* task card */
.task-card{background:white;border:1.5px solid var(--line);border-radius:10px;
  padding:10px 12px;display:flex;align-items:flex-start;gap:10px;
  position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s,opacity .2s;
  animation:cardIn .3s cubic-bezier(.16,1,.3,1) both;}
@keyframes cardIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.task-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;}
.task-card.cat-academics::before{background:var(--slate);}
.task-card.cat-work::before{background:var(--gold);}
.task-card.cat-personal::before{background:var(--sage);}
.task-card.cat-coding::before{background:var(--plum);}
.task-card.cat-other::before{background:var(--ink-f);}
.task-card:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(43,42,40,.08);}
.task-card.done{opacity:.4;}
.task-card.done .task-title{text-decoration:line-through;color:var(--ink-f);}

.check-stamp{width:20px;height:20px;border-radius:5px;border:2px solid var(--ink-f);flex-shrink:0;
  margin-top:2px;display:flex;align-items:center;justify-content:center;
  transition:background .12s,border-color .12s;cursor:pointer;}
.check-stamp.checked{background:var(--sage);border-color:var(--sage-d);}
.check-stamp.checked i{color:white;}
.check-stamp i{font-size:12px;color:transparent;}
.task-body{flex:1;min-width:0;}
.task-title{font-size:13.5px;font-weight:600;margin-bottom:4px;line-height:1.3;}
.task-notes{font-size:12px;color:var(--ink-s);margin-bottom:5px;line-height:1.4;}
.task-meta{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;
  display:inline-flex;align-items:center;gap:3px;text-transform:uppercase;letter-spacing:.04em;}
.tag-academics{background:var(--slate-s);color:var(--slate-d);}
.tag-work{background:var(--gold-s);color:var(--gold-d);}
.tag-personal{background:var(--sage-s);color:var(--sage-d);}
.tag-coding{background:var(--plum-s);color:var(--plum-d);}
.tag-other{background:var(--cream-dd);color:var(--ink-s);}
.pill{font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:99px;
  display:inline-flex;align-items:center;gap:3px;}
.pill-high{background:var(--accent-s);color:var(--accent-d);}
.pill-medium{background:var(--gold-s);color:var(--gold-d);}
.pill-low{background:var(--cream-dd);color:var(--ink-s);}
.pill .dot{width:5px;height:5px;border-radius:50%;}
.pill-high .dot{background:var(--accent-d);}
.pill-medium .dot{background:var(--gold-d);}
.pill-low .dot{background:var(--ink-f);}
.due-chip{font-size:11px;color:var(--ink-f);display:flex;align-items:center;gap:3px;}
.due-chip.overdue{color:var(--accent-d);font-weight:700;}
.due-chip.today{color:var(--slate-d);font-weight:700;}
.task-del{padding:3px;border-radius:6px;color:var(--ink-f);flex-shrink:0;
  transition:color .12s,background .12s;opacity:0;}
.task-card:hover .task-del{opacity:1;}
.task-del:hover{color:var(--accent-d);background:var(--accent-s);}
.empty-state{text-align:center;padding:40px 20px;color:var(--ink-f);}
.empty-state i{font-size:28px;margin-bottom:8px;display:block;}
.empty-state p{font-family:'Fraunces',serif;font-size:16px;color:var(--ink);margin-bottom:4px;}
.empty-state span{font-size:13px;}

/* ══════════════════════════════════════════════════════
   JOURNAL PAGE
══════════════════════════════════════════════════════ */
#page-journal{gap:0;}

/* tree */
.journal-tree{width:240px;flex-shrink:0;border-right:1.5px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;background:var(--cream);}
.journal-tree-head{padding:12px 14px;border-bottom:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.journal-tree-head h3{font-size:14px;}
.journal-tree-scroll{flex:1;overflow-y:auto;padding:6px;}
.journal-tree-scroll::-webkit-scrollbar{width:4px;}
.journal-tree-scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px;}

.tree-year{margin-bottom:2px;}
.tree-year-label{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:6px;cursor:pointer;
  font-family:'Fraunces',serif;font-size:14px;font-weight:600;transition:background .1s;}
.tree-year-label:hover{background:var(--cream-dd);}
.tree-year-label .ti{font-size:13px;color:var(--ink-f);transition:transform .15s;display:inline-block;}
.tree-months{display:none;padding-left:8px;}
.tree-months.open{display:block;}
.tree-month-label{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;cursor:pointer;
  font-size:13px;font-weight:500;color:var(--ink-s);transition:background .1s;}
.tree-month-label:hover{background:var(--cream-dd);}
.tree-month-label .ti{font-size:12px;color:var(--ink-f);transition:transform .15s;display:inline-block;}
.tree-weeks{display:none;padding-left:8px;}
.tree-weeks.open{display:block;}
.tree-week-label{display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:6px;cursor:pointer;
  font-size:12px;font-weight:500;color:var(--ink-f);transition:background .1s;}
.tree-week-label:hover{background:var(--cream-dd);}
.tree-week-label .ti{font-size:11px;transition:transform .15s;display:inline-block;}
.tree-days{display:none;padding-left:6px;}
.tree-days.open{display:block;}
.tree-day{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:6px;cursor:pointer;
  font-size:12.5px;color:var(--ink-s);transition:background .1s;}
.tree-day:hover{background:var(--cream-dd);}
.tree-day.active{background:white;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(43,42,40,.07);}
.tree-day .day-dot{width:7px;height:7px;border-radius:50%;background:var(--cream-dd);flex-shrink:0;}
.tree-day.active .day-dot{background:var(--accent);}
.tree-day.has-entry .day-dot{background:var(--accent-s);}
.tree-day.active.has-entry .day-dot{background:var(--accent);}
.day-col{display:flex;flex-direction:column;min-width:0;flex:1;}
.day-snippet{font-size:11px;color:var(--ink-f);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* editor */
.journal-editor{flex:1;display:flex;flex-direction:column;overflow:hidden;background:white;}
.week-strip{display:flex;border-bottom:1.5px solid var(--line);flex-shrink:0;}
.week-day-btn{flex:1;padding:8px 4px;text-align:center;border-right:1px solid var(--line);cursor:pointer;
  transition:background .1s;display:flex;flex-direction:column;gap:2px;align-items:center;}
.week-day-btn:last-child{border-right:none;}
.week-day-btn:hover{background:var(--cream);}
.week-day-btn.active{background:var(--accent-s);}
.week-day-btn .wday{font-size:10.5px;font-weight:600;color:var(--ink-f);text-transform:uppercase;letter-spacing:.05em;}
.week-day-btn .wnum{font-family:'Fraunces',serif;font-size:15px;font-weight:600;color:var(--ink);}
.week-day-btn .wdot{width:5px;height:5px;border-radius:50%;background:var(--line);}
.week-day-btn.has-entry .wdot{background:var(--accent);}
.week-day-btn.active .wday,.week-day-btn.active .wnum{color:var(--accent-d);}
.week-day-btn.is-today .wnum{color:var(--accent);}

.editor-top{padding:14px 24px;border-bottom:1.5px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;gap:16px;}
.editor-date-label{font-family:'Fraunces',serif;font-size:20px;font-weight:600;}
.editor-date-meta{font-size:12px;color:var(--ink-f);margin-top:2px;}
.date-nav{display:flex;gap:6px;align-items:center;}
.date-nav-btn{width:30px;height:30px;border-radius:7px;border:1.5px solid var(--line);
  background:white;display:flex;align-items:center;justify-content:center;
  color:var(--ink-s);font-size:16px;transition:background .12s;cursor:pointer;}
.date-nav-btn:hover{background:var(--cream-d);}
.date-today-btn{width:auto;padding:0 10px;height:30px;border-radius:7px;border:1.5px solid var(--line);
  background:white;font-size:12px;font-weight:600;color:var(--ink-s);transition:background .12s;cursor:pointer;}
.date-today-btn:hover{background:var(--cream-d);}

.editor-area{flex:1;overflow:hidden;position:relative;
  background-image:repeating-linear-gradient(transparent,transparent 36px,var(--line) 36px,var(--line) 37px);
  background-position:0 60px;background-attachment:local;}
.editor-area textarea{width:100%;height:100%;padding:24px 32px;
  font-size:15px;line-height:2.37;color:var(--ink);background:transparent;
  border:none;resize:none;font-family:'Inter',sans-serif;}
.editor-area textarea::placeholder{color:var(--ink-f);}

.editor-footer{padding:8px 24px;border-top:1.5px solid var(--line);flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;}
.word-count{font-size:12px;color:var(--ink-f);}
.save-status{font-size:12px;color:var(--ink-f);display:flex;align-items:center;gap:5px;}
.save-status.saved{color:var(--sage-d);}
.save-status.saving{color:var(--gold-d);}
.editor-hint{font-size:11.5px;color:var(--ink-f);font-family:'JetBrains Mono',monospace;}

/* ── modal ──────────────────────────────────────────── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(43,42,40,.35);
  z-index:100;align-items:center;justify-content:center;backdrop-filter:blur(2px);}
.modal-bg.open{display:flex;}
.modal{background:var(--cream);border-radius:16px;border:1.5px solid var(--line);
  width:420px;max-width:95vw;box-shadow:0 16px 48px rgba(43,42,40,.18);
  animation:modalIn .2s cubic-bezier(.16,1,.3,1);}
@keyframes modalIn{from{opacity:0;transform:scale(.95) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal-head{padding:18px 20px 14px;border-bottom:1.5px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;}
.modal-head h3{font-size:17px;}
.modal-close{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  color:var(--ink-f);font-size:18px;transition:background .12s;}
.modal-close:hover{background:var(--cream-d);}
.modal-body{padding:18px 20px;}
.modal-body .field{margin-bottom:10px;}
.modal-body .field input,.modal-body .field select,.modal-body .field textarea{
  width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--r-s);
  background:white;font-size:14px;color:var(--ink);transition:border-color .15s;}
.modal-body .field input:focus,.modal-body .field select:focus,.modal-body .field textarea:focus{border-color:var(--accent);}
.modal-body .field textarea{resize:none;line-height:1.5;}
.modal-body .row{display:flex;gap:8px;}
.modal-body .row .field{flex:1;margin-bottom:0;}
.modal-foot{padding:14px 20px;border-top:1.5px solid var(--line);display:flex;gap:8px;justify-content:flex-end;}
</style>
</head>
<body>

<!-- sidebar -->
<aside class="sidebar">
  <div class="brand">
    <span class="brand-mark"><i class="ti ti-feather"></i></span>
    Daybook
  </div>
  <nav class="nav">
    <div class="nav-item active" data-page="tasks">
      <i class="ti ti-layout-kanban"></i> Tasks
      <span class="badge" id="nav-badge" style="display:none"></span>
    </div>
    <div class="nav-item" data-page="journal">
      <i class="ti ti-notebook"></i> Journal
    </div>
  </nav>
  <div class="sidebar-date" id="sidebar-date"></div>
</aside>

<!-- shell -->
<div class="shell">

  <!-- topbar -->
  <div class="topbar">
    <h2 id="topbar-title">Tasks</h2>
    <div class="topbar-actions">
      <div class="search-wrap" id="search-wrap">
        <i class="ti ti-search"></i>
        <input type="text" id="inp-search" placeholder="Search tasks…">
      </div>
      <button class="btn btn-primary" id="btn-open-add">
        <i class="ti ti-plus"></i> Add task
      </button>
    </div>
  </div>

  <!-- TASKS PAGE -->
  <div class="page active" id="page-tasks">

    <div class="tasks-left">
      <div class="stat-strip">
        <div class="stat-cell"><div class="num" id="st-total">0</div><div class="lbl">Total</div></div>
        <div class="stat-cell"><div class="num" id="st-pending">0</div><div class="lbl">Pending</div></div>
        <div class="stat-cell success"><div class="num" id="st-done">0</div><div class="lbl">Done</div></div>
        <div class="stat-cell danger"><div class="num" id="st-overdue">0</div><div class="lbl">Overdue</div></div>
      </div>

      <div class="filter-bar">
        <button class="filter-pill active" data-filter="all">All</button>
        <button class="filter-pill cat-academics" data-filter="academics">Acad</button>
        <button class="filter-pill cat-work" data-filter="work">Work</button>
        <button class="filter-pill cat-personal" data-filter="personal">Personal</button>
        <button class="filter-pill cat-coding" data-filter="coding">Coding</button>
      </div>

      <div class="filter-bar">
        <span class="sort-label">Sort:</span>
        <button class="filter-pill active" data-sort="due">Due</button>
        <button class="filter-pill" data-sort="priority">Priority</button>
        <button class="filter-pill" data-sort="created">Newest</button>
      </div>

      <div style="flex:1;"></div>

      <div class="today-panel">
        <div class="tp-head">
          <span>Today's progress</span>
          <span id="tp-pct" style="font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--accent-d);">0%</span>
        </div>
        <div class="progress-bar"><div class="fill" id="tp-bar" style="width:0%"></div></div>
        <div class="next-up" id="tp-next">
          <i class="ti ti-sparkles"></i><span>All caught up!</span>
        </div>
      </div>
    </div>

    <div class="tasks-right">
      <div class="task-list-pane" id="task-list"></div>
    </div>
  </div>

  <!-- JOURNAL PAGE -->
  <div class="page" id="page-journal">

    <div class="journal-tree">
      <div class="journal-tree-head">
        <h3>Entries</h3>
        <button class="btn btn-primary" id="btn-today-entry" style="padding:5px 10px;font-size:12px;">
          <i class="ti ti-pencil"></i> Today
        </button>
      </div>
      <div class="journal-tree-scroll" id="journal-tree-scroll">
        <div style="text-align:center;padding:24px;color:var(--ink-f);font-size:13px;">No entries yet</div>
      </div>
    </div>

    <div class="journal-editor">
      <div class="week-strip" id="week-strip"></div>
      <div class="editor-top">
        <div>
          <div class="editor-date-label" id="editor-date-label">—</div>
          <div class="editor-date-meta" id="editor-date-meta"></div>
        </div>
        <div class="date-nav">
          <button class="date-nav-btn" id="btn-prev"><i class="ti ti-chevron-left"></i></button>
          <button class="date-today-btn" id="btn-today">Today</button>
          <button class="date-nav-btn" id="btn-next"><i class="ti ti-chevron-right"></i></button>
        </div>
      </div>
      <div class="editor-area">
        <textarea id="journal-ta" placeholder="Write about your day…&#10;&#10;What happened? What did you accomplish? How did it feel?"></textarea>
      </div>
      <div class="editor-footer">
        <div class="word-count" id="word-count">0 words</div>
        <div style="display:flex;gap:16px;align-items:center;">
          <span class="editor-hint">Ctrl+S to save · Ctrl+← → to navigate</span>
          <div class="save-status saved" id="save-status"><i class="ti ti-cloud-check"></i> <span>saved</span></div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- Add Task Modal -->
<div class="modal-bg" id="modal-add">
  <div class="modal">
    <div class="modal-head">
      <h3>Add a task</h3>
      <button class="modal-close" id="modal-close"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <div class="field"><input type="text" id="m-title" placeholder="What needs to get done?"></div>
      <div class="row">
        <div class="field">
          <select id="m-cat">
            <option value="academics">Academics</option>
            <option value="work">Work</option>
            <option value="personal">Personal</option>
            <option value="coding">Coding</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <select id="m-pri">
            <option value="high">High priority</option>
            <option value="medium" selected>Medium priority</option>
            <option value="low">Low priority</option>
          </select>
        </div>
      </div>
      <div class="field" style="margin-top:10px;"><input type="date" id="m-due"></div>
      <div class="field" style="margin-top:10px;"><textarea id="m-notes" rows="2" placeholder="Notes (optional)"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-submit"><i class="ti ti-plus"></i> Add task</button>
    </div>
  </div>
</div>

<script>
/* ─── helpers ──────────────────────────────────────── */
const $=id=>document.getElementById(id);
const uid=()=>'t'+Date.now()+Math.random().toString(36).slice(2,7);
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML;};
const todayMid=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};

/* ═══════════════════════════════════════════════════════
   TASKS
═══════════════════════════════════════════════════════ */
let tasks=[], taskFilter='all', taskSort='due', taskSearch='';

const API='/api/tasks';
const isOverdue=t=>!(!t.due||t.done)&&new Date(t.due+'T00:00:00')<todayMid();
const isDueToday=t=>{
  if(!t.due||t.done)return false;
  const d=new Date(t.due+'T00:00:00');const n=todayMid();return d.getTime()===n.getTime();
};
const fmtDate=d=>d?new Date(d+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}):'';
const priRank=p=>p==='high'?0:p==='medium'?1:2;

const catIcons={academics:'ti-school',work:'ti-briefcase',personal:'ti-heart',coding:'ti-code',other:'ti-dots'};
const catLbl={academics:'Academics',work:'Work',personal:'Personal',coding:'Coding',other:'Other'};
const priLbl={high:'High',medium:'Medium',low:'Low'};

async function loadTasks(){
  try{const r=await fetch(API);if(!r.ok)throw 0;tasks=await r.json();}catch{tasks=[];}
}
async function apiCreate(t){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(t)});
  if(!r.ok)throw 0;return r.json();
}
async function apiPatch(id,p){
  const r=await fetch(`${API}/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});
  if(!r.ok)throw 0;
}
async function apiDel(id){await fetch(`${API}/${id}`,{method:'DELETE'});}

function renderTasks(){
  let list=[...tasks];
  if(taskSearch){const q=taskSearch.toLowerCase();list=list.filter(t=>t.title.toLowerCase().includes(q)||(t.notes||'').toLowerCase().includes(q));}
  if(taskFilter!=='all')list=list.filter(t=>t.category===taskFilter);
  list.sort((a,b)=>{
    if(a.done!==b.done)return a.done?1:-1;
    if(taskSort==='due'){if(!a.due&&!b.due)return 0;if(!a.due)return 1;if(!b.due)return-1;return new Date(a.due)-new Date(b.due);}
    if(taskSort==='priority')return priRank(a.priority)-priRank(b.priority);
    return b.created-a.created;
  });

  const pane=$('task-list');
  if(list.length===0){
    pane.innerHTML=`<div class="empty-state"><i class="ti ti-clipboard-list"></i><p>A blank page</p><span>Add a task to get started</span></div>`;
  }else{
    pane.innerHTML=list.map((t,i)=>{
      const ov=isOverdue(t),dt=isDueToday(t);
      const ds=t.due?fmtDate(t.due):'';
      let dc='',dsuf='';
      if(ov){dc='overdue';dsuf=' · overdue';}else if(dt){dc='today';dsuf=' · today';}
      return`<div class="task-card cat-${t.category}${t.done?' done':''}" style="animation-delay:${Math.min(i,10)*.025}s">
        <div class="check-stamp${t.done?' checked':''}" data-action="toggle" data-id="${t.id}"><i class="ti ti-check"></i></div>
        <div class="task-body">
          <div class="task-title">${esc(t.title)}</div>
          ${t.notes?`<div class="task-notes">${esc(t.notes)}</div>`:''}
          <div class="task-meta">
            <span class="tag tag-${t.category}"><i class="ti ${catIcons[t.category]}"></i>${catLbl[t.category]}</span>
            <span class="pill pill-${t.priority}"><span class="dot"></span>${priLbl[t.priority]}</span>
            ${ds?`<span class="due-chip ${dc}"><i class="ti ti-calendar" style="font-size:11px"></i>${ds}${dsuf}</span>`:''}
          </div>
        </div>
        <button class="task-del" data-action="delete" data-id="${t.id}" title="Delete"><i class="ti ti-trash" style="font-size:15px"></i></button>
      </div>`;
    }).join('');
  }

  const pending=tasks.filter(t=>!t.done);
  const done=tasks.filter(t=>t.done);
  const overdue=tasks.filter(isOverdue);
  $('st-total').textContent=tasks.length;
  $('st-pending').textContent=pending.length;
  $('st-done').textContent=done.length;
  $('st-overdue').textContent=overdue.length;

  const badge=$('nav-badge');
  badge.textContent=pending.length||'';
  badge.style.display=pending.length?'':'none';

  const pct=tasks.length?Math.round(done.length/tasks.length*100):0;
  $('tp-pct').textContent=pct+'%';
  $('tp-bar').style.width=pct+'%';

  const np=$('tp-next');
  const up=pending.slice().sort((a,b)=>{
    if(!a.due&&!b.due)return priRank(a.priority)-priRank(b.priority);
    if(!a.due)return 1;if(!b.due)return-1;return new Date(a.due)-new Date(b.due);
  })[0];
  np.innerHTML=up
    ?`<i class="ti ${isOverdue(up)?'ti-alert-triangle':catIcons[up.category]}" style="color:var(--accent-d)"></i><span>${esc(up.title)}${up.due?' · '+fmtDate(up.due):''}</span>`
    :`<i class="ti ti-sparkles"></i><span>All caught up!</span>`;
}

$('task-list').addEventListener('click',async e=>{
  const btn=e.target.closest('[data-action]');if(!btn)return;
  const id=btn.dataset.id,action=btn.dataset.action;
  if(action==='toggle'){
    const t=tasks.find(x=>x.id===id);if(!t)return;
    t.done=!t.done;renderTasks();
    try{await apiPatch(id,{done:t.done});}catch{t.done=!t.done;renderTasks();}
  }else if(action==='delete'){
    const prev=[...tasks];tasks=tasks.filter(x=>x.id!==id);renderTasks();
    try{await apiDel(id);}catch{tasks=prev;renderTasks();}
  }
});

document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{
  taskFilter=b.dataset.filter;
  document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');renderTasks();
}));
document.querySelectorAll('[data-sort]').forEach(b=>b.addEventListener('click',()=>{
  taskSort=b.dataset.sort;
  document.querySelectorAll('[data-sort]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');renderTasks();
}));
$('inp-search').addEventListener('input',e=>{taskSearch=e.target.value;renderTasks();});

// modal
const openModal=()=>{$('modal-add').classList.add('open');$('m-title').focus();};
const closeModal=()=>$('modal-add').classList.remove('open');
$('btn-open-add').addEventListener('click',openModal);
$('modal-close').addEventListener('click',closeModal);
$('modal-cancel').addEventListener('click',closeModal);
$('modal-add').addEventListener('click',e=>{if(e.target===$('modal-add'))closeModal();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if((e.ctrlKey||e.metaKey)&&e.key==='n'&&!e.shiftKey){e.preventDefault();openModal();}
});
$('m-title').addEventListener('keydown',e=>{if(e.key==='Enter')$('modal-submit').click();});

$('modal-submit').addEventListener('click',async()=>{
  const title=$('m-title').value.trim();if(!title)return;
  const task={id:uid(),title,category:$('m-cat').value,priority:$('m-pri').value,
    due:$('m-due').value,notes:$('m-notes').value.trim(),done:false,created:Date.now()};
  tasks.unshift(task);renderTasks();closeModal();
  $('m-title').value='';$('m-notes').value='';$('m-due').value='';
  try{await apiCreate(task);}catch{tasks=tasks.filter(t=>t.id!==task.id);renderTasks();}
});

/* ═══════════════════════════════════════════════════════
   JOURNAL
═══════════════════════════════════════════════════════ */
const JAPI='/api/journal';
const JLOCAL='daybook_journal_v1';
let entries={}, currentDate=todayStr(), saveTimer=null, lastSaved='';

function todayStr(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function addDays(ds,n){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function weekRange(ds){
  const d=new Date(ds+'T00:00:00'),day=d.getDay();
  const mon=new Date(d);mon.setDate(d.getDate()-(day===0?6:day-1));
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  const f=x=>x.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  return`${f(mon)} – ${f(sun)}`;
}

function localLoadJournal(){try{const r=localStorage.getItem(JLOCAL);return r?JSON.parse(r):{};} catch{return{};}}
function localSaveJournal(){try{localStorage.setItem(JLOCAL,JSON.stringify(entries));}catch{}}

async function loadJournal(){
  // Load localStorage immediately so page renders right away
  entries=localLoadJournal();
  // Then try to sync from backend (if Neon is set up)
  try{
    const r=await fetch(JAPI);
    if(!r.ok)throw 0;
    const list=await r.json();
    list.forEach(e=>{entries[e.date]=e;});
    localSaveJournal();
  }catch{ /* backend not set up yet — localStorage is fine */ }
}

async function flushSave(){
  const content=$('journal-ta').value;
  if(content===lastSaved)return;
  lastSaved=content;
  setSaveStatus('saving');
  const existing=entries[currentDate];
  const payload={id:existing?.id||uid(),date:currentDate,content};
  // Save locally first — always works
  entries[currentDate]={...payload,created:existing?.created||Date.now(),updated:Date.now()};
  localSaveJournal();
  // Then try backend
  try{
    const r=await fetch(existing?`${JAPI}/${existing.id}`:JAPI,{
      method:existing?'PATCH':'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    if(!r.ok)throw 0;
    entries[currentDate]=await r.json();
    localSaveJournal();
  }catch{ /* local save already done above */ }
  setSaveStatus('saved');
  renderJournalTree();renderWeekStrip(currentDate);
}

function setSaveStatus(s){
  const el=$('save-status');
  if(s==='saved'){el.className='save-status saved';el.innerHTML='<i class="ti ti-cloud-check"></i> <span>saved</span>';}
  else if(s==='saving'){el.className='save-status saving';el.innerHTML='<i class="ti ti-loader-2"></i> <span>saving…</span>';}
  else{el.className='save-status';el.innerHTML='<i class="ti ti-cloud"></i> <span>unsaved</span>';}
}

function renderJournalTree(){
  const scroll=$('journal-tree-scroll');
  const dates=Object.keys(entries).sort().reverse();
  if(!dates.length){scroll.innerHTML='<div style="text-align:center;padding:24px;color:var(--ink-f);font-size:13px;">No entries yet</div>';return;}

  // build tree: year → month → week → [dates]
  const tree={};
  const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  dates.forEach(ds=>{
    const d=new Date(ds+'T00:00:00');
    const yr=d.getFullYear(),mo=d.getMonth(),wk=weekRange(ds);
    if(!tree[yr])tree[yr]={};
    if(!tree[yr][mo])tree[yr][mo]={};
    if(!tree[yr][mo][wk])tree[yr][mo][wk]=[];
    tree[yr][mo][wk].push(ds);
  });

  let html='';
  Object.keys(tree).sort().reverse().forEach(yr=>{
    html+=`<div class="tree-year">
      <div class="tree-year-label" onclick="toggleNode(this)">
        <i class="ti ti-chevron-right" style="transform:rotate(90deg)"></i>${yr}
      </div><div class="tree-months open">`;
    Object.keys(tree[yr]).sort((a,b)=>b-a).forEach(mo=>{
      html+=`<div><div class="tree-month-label" onclick="toggleNode(this)">
        <i class="ti ti-chevron-right" style="transform:rotate(90deg)"></i>${months[mo]}
      </div><div class="tree-weeks open">`;
      Object.keys(tree[yr][mo]).forEach(wk=>{
        html+=`<div><div class="tree-week-label" onclick="toggleNode(this)">
          <i class="ti ti-chevron-right" style="transform:rotate(90deg)"></i>${wk}
        </div><div class="tree-days open">`;
        tree[yr][mo][wk].sort().reverse().forEach(ds=>{
          const e=entries[ds];
          const snippet=e?.content?.trim().replace(/\n/g,' ').slice(0,38)||'';
          const isActive=ds===currentDate;
          const hasEntry=!!e?.content?.trim();
          const d=new Date(ds+'T00:00:00');
          const label=d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
          html+=`<div class="tree-day${isActive?' active':''}${hasEntry?' has-entry':''}" onclick="navigateTo('${ds}')">
            <div class="day-dot"></div>
            <div class="day-col"><span>${label}</span>${snippet?`<span class="day-snippet">${esc(snippet)}</span>`:''}</div>
          </div>`;
        });
        html+=`</div></div>`;
      });
      html+=`</div></div>`;
    });
    html+=`</div></div>`;
  });
  scroll.innerHTML=html;
}

window.toggleNode=function(el){
  const icon=el.querySelector('.ti');
  const next=el.nextElementSibling;
  if(!next)return;
  const isOpen=next.classList.toggle('open');
  icon.style.transform=isOpen?'rotate(90deg)':'rotate(0deg)';
};

function renderWeekStrip(ds){
  const strip=$('week-strip');
  const d=new Date(ds+'T00:00:00');
  const day=d.getDay();
  const mon=new Date(d);mon.setDate(d.getDate()-(day===0?6:day-1));
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const today=todayStr();
  let html='';
  for(let i=0;i<7;i++){
    const dv=new Date(mon);dv.setDate(mon.getDate()+i);
    const s=`${dv.getFullYear()}-${String(dv.getMonth()+1).padStart(2,'0')}-${String(dv.getDate()).padStart(2,'0')}`;
    const active=s===ds,isToday=s===today,hasEntry=!!entries[s]?.content?.trim();
    html+=`<div class="week-day-btn${active?' active':''}${isToday?' is-today':''}${hasEntry?' has-entry':''}" onclick="navigateTo('${s}')">
      <div class="wday">${days[i]}</div>
      <div class="wnum">${dv.getDate()}</div>
      <div class="wdot"></div>
    </div>`;
  }
  strip.innerHTML=html;
}

function renderEditor(){
  const ta=$('journal-ta');
  const e=entries[currentDate];
  ta.value=e?.content||'';
  lastSaved=ta.value;
  const today=todayStr();
  const d=new Date(currentDate+'T00:00:00');
  $('editor-date-label').textContent=currentDate===today?'Today':d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  $('editor-date-meta').textContent=d.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric',weekday:'long'});
  updateWordCount();setSaveStatus('saved');
  renderWeekStrip(currentDate);renderJournalTree();
}

window.navigateTo=function(ds){flushSave();currentDate=ds;renderEditor();};

function updateWordCount(){
  const txt=$('journal-ta').value.trim();
  const w=txt?txt.split(/\s+/).length:0;
  $('word-count').textContent=`${w} word${w!==1?'s':''}`;
}

$('journal-ta').addEventListener('input',()=>{
  updateWordCount();setSaveStatus('unsaved');
  clearTimeout(saveTimer);saveTimer=setTimeout(flushSave,1400);
});
$('journal-ta').addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();clearTimeout(saveTimer);flushSave();}
  if((e.ctrlKey||e.metaKey)&&e.key==='ArrowLeft'){e.preventDefault();flushSave();currentDate=addDays(currentDate,-1);renderEditor();}
  if((e.ctrlKey||e.metaKey)&&e.key==='ArrowRight'){e.preventDefault();flushSave();currentDate=addDays(currentDate,1);renderEditor();}
});
$('btn-prev').addEventListener('click',()=>{flushSave();currentDate=addDays(currentDate,-1);renderEditor();});
$('btn-next').addEventListener('click',()=>{flushSave();currentDate=addDays(currentDate,1);renderEditor();});
$('btn-today').addEventListener('click',()=>{flushSave();currentDate=todayStr();renderEditor();});
$('btn-today-entry').addEventListener('click',()=>{flushSave();currentDate=todayStr();renderEditor();});

/* ═══════════════════════════════════════════════════════
   NAV
═══════════════════════════════════════════════════════ */
document.querySelectorAll('.nav-item').forEach(item=>{
  item.addEventListener('click',()=>{
    const page=item.dataset.page;
    if(!page)return;
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    item.classList.add('active');
    // hide all pages
    document.querySelectorAll('.page').forEach(p=>{p.classList.remove('active');p.style.display='none';});
    // show target page
    const target=document.getElementById('page-'+page);
    if(target){target.classList.add('active');target.style.display='flex';}
    $('topbar-title').textContent=page==='tasks'?'Tasks':'Journal';
    $('search-wrap').style.display=page==='tasks'?'':'none';
    $('btn-open-add').style.display=page==='tasks'?'':'none';
    if(page==='journal')renderEditor();
  });
});

/* ── init ────────────────────────────────────────────── */
function setSidebarDate(){
  $('sidebar-date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
}

(async()=>{
  setSidebarDate();
  await Promise.all([loadTasks(),loadJournal()]);
  renderTasks();
  renderEditor();
})();
</script>
</body>
</html>
